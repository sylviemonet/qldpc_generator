[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qldpc-generator"
version = "0.2.0"
description = "Finite binary constructions and reproducible checks for the qLDPC review"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "sympy>=1.12"]

[project.optional-dependencies]
test = ["pytest>=7"]
notebooks = ["nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]

[tool.setuptools.packages.find]
include = ["qldpc_generator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
